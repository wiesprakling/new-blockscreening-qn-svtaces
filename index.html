<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffd9e8; --ticket:#fff7fa; --ink:#6b0f3a; --accent:#e6246f; --soft:#f7a8c8; --muted:#a2557a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh}
  main{max-width:880px;margin:0 auto;padding:48px 20px 64px}
  h1{font:800 clamp(2.4rem,7vw,4rem)/1 "Bricolage Grotesque",sans-serif;margin:0 0 8px;letter-spacing:-.02em}
  .sub{margin:0 0 28px;color:var(--muted)}
  .search{width:100%;padding:14px 18px;border:2px solid var(--soft);border-radius:999px;background:#fff;font:inherit;color:var(--ink);margin-bottom:24px}
  .search:focus{outline:3px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;list-style:none;padding:0;margin:0}
  .ticket{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ticket);border-radius:14px;padding:18px 20px 18px 22px;box-shadow:0 2px 0 var(--soft)}
  .ticket::before,.ticket::after{content:"";position:absolute;right:92px;width:16px;height:16px;background:var(--bg);border-radius:50%}
  .ticket::before{top:-8px}.ticket::after{bottom:-8px}
  .name{font-weight:500;font-size:1.1rem;overflow-wrap:anywhere}
  .qn{flex:none;width:72px;text-align:center;padding-left:12px;border-left:2px dashed var(--soft);font:800 2.2rem/1 "Bricolage Grotesque",sans-serif;color:var(--accent)}
  .status{margin-top:28px;color:var(--muted);font-size:.9rem}
  .msg{background:var(--ticket);border-radius:14px;padding:20px;color:var(--ink)}
  @media (prefers-reduced-motion:no-preference){.ticket{transition:transform .15s}.ticket:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<main>
  <h1>Queue numbers</h1>
  <p class="sub">Find your name to see your queue number.</p>
  <input id="q" class="search" type="search" placeholder="Search your name" aria-label="Search your name" autocomplete="off">
  <ul id="list" class="grid" aria-live="polite"></ul>
  <p id="status" class="status"></p>
</main>

<script>
/* ====== PASTE YOUR GOOGLE SHEET CSV LINK BETWEEN THE QUOTES ====== */
const SHEET_CSV_URL = "PASTE_YOUR_PUBLISHED_CSV_LINK_HERE";
/* How often to refresh, in seconds */
const REFRESH_SECONDS = 30;

let rows = [];
const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const searchEl = document.getElementById("q");

function parseCSV(text){
  const out=[]; let row=[], cell="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=c;
    } else if(c==='"') inQ=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&text[i+1]==="\n") i++;
      row.push(cell); out.push(row); row=[]; cell="";
    } else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); out.push(row); }
  return out;
}

function render(){
  const term = searchEl.value.trim().toLowerCase();
  const shown = rows.filter(r => r.name.toLowerCase().includes(term));
  listEl.innerHTML = "";
  if(!shown.length){
    const li=document.createElement("li");
    li.className="msg";
    li.textContent = rows.length ? "No one matches that name. Check the spelling and try again." : "No queue numbers yet. Check back soon.";
    listEl.appendChild(li);
    return;
  }
  for(const r of shown){
    const li=document.createElement("li"); li.className="ticket";
    const n=document.createElement("span"); n.className="name"; n.textContent=r.name;
    const q=document.createElement("span"); q.className="qn"; q.textContent=r.qn;
    li.append(n,q); listEl.appendChild(li);
  }
}

async function load(){
  if(SHEET_CSV_URL.startsWith("PASTE_")){
    statusEl.textContent="Add your Google Sheet link in index.html to show queue numbers.";
    return;
  }
  try{
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?")?"&":"?") + "t=" + Date.now());
    if(!res.ok) throw new Error(res.status);
    const data = parseCSV(await res.text());
    rows = data.slice(1)
      .map(r => ({name:(r[0]||"").trim(), qn:(r[1]||"").trim()}))
      .filter(r => r.name && r.qn)
      .sort((a,b) => {
        const x=parseFloat(a.qn), y=parseFloat(b.qn);
        return (isNaN(x)||isNaN(y)) ? a.qn.localeCompare(b.qn,undefined,{numeric:true}) : x-y;
      });
    statusEl.textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) + ". Refreshes automatically.";
    render();
  }catch(e){
    statusEl.textContent = "Couldn't load the list. Check that the sheet is published to the web as CSV.";
  }
}

searchEl.addEventListener("input", render);
load();
setInterval(load, REFRESH_SECONDS*1000);
</script>
</body>
</html>
